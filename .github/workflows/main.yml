name: CI/CD
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Django dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Check Django configuration
        run: python server/manage.py check
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Express syntax
        run: find server/database -maxdepth 1 -name '*.js' -exec node --check {} \;
      - name: Install React dependencies
        working-directory: server/frontend
        run: npm install --legacy-peer-deps
      - name: Build React frontend
        working-directory: server/frontend
        run: npm run build
